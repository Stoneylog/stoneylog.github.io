:root{

.btn:hover{

.secondary{

text-align:center;
}

.stat{
padding:50px 30px;

.card{

background:white;

.fleet-image{

.quote-box{

.contact-grid{

}

.contact-card{

box-shadow:0 8px 25px rgba(0,0,0,.08);

.contact-card a{

footer{

background:var(--navy);

text-align:center;

padding:50px 20px;

right:25px;
bottom:25px;

color:white;

padding:16px 25px;

border-radius:50px;

text-decoration:none;

font-weight:600;

box-shadow:0 10px 25px rgba(0,0,0,.2);
}

@media(max-width:900px){

.hero h1{
font-size:42px;
}

.hero p{
font-size:18px;
}

nav{
flex-direction:column;
}

nav ul{
margin-top:15px;
flex-wrap:wrap;
justify-content:center;
}

.stats{
grid-template-columns:repeat(2,1fr);
}
